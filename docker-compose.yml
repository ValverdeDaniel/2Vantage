services:
  db:
    image: postgres:15
    # Postgres is often killed rather than stopped locally; syncfs keeps crash recovery quick.
    command: ["postgres", "-c", "recovery_init_sync_method=syncfs"]
    stop_grace_period: 60s
    ports: ["5436:5432"]
    environment:
      POSTGRES_DB: ${DB_NAME:-vantage2}
      POSTGRES_USER: ${DB_USER:-vantage}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-vantage-dev}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-vantage} -d ${DB_NAME:-vantage2}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build: .
    ports: ["8004:8000"]
    volumes: [".:/app", "media:/data/media"]
    environment: &backend-env
      ENVIRONMENT: local
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-not-secret}
      DB_NAME: ${DB_NAME:-vantage2}
      DB_USER: ${DB_USER:-vantage}
      DB_PASSWORD: ${DB_PASSWORD:-vantage-dev}
      DB_HOST: db
      DB_PORT: "5432"
      FRONTEND_URL: http://localhost:4001
      MEDIA_ROOT: /data/media
      AGENCY_TIME_ZONE: ${AGENCY_TIME_ZONE:-America/New_York}
      # Claude (slice 18 on). The key comes from the git-ignored .env; empty means no Claude. Local testing uses
      # Sonnet and a $20 cap on all real Claude spend in this database (Daniel, 2026-11-12; plan.md §3.5).
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5-5}
      AI_TOTAL_BUDGET_USD: ${AI_TOTAL_BUDGET_USD:-20}
      # The PHI-gate switch (plan.md 11.4 item 7; slice 47): on for local development, whose data is synthetic only,
      # so the census, intake and questionnaire readers (slices 51-52, 59) register. Staging and production keep it off
      # until deploy/phi-gate.md is signed.
      AI_PHI_READERS: ${AI_PHI_READERS:-true}
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped

  # Runs queued jobs (reads, chats, re-checks, Rank, locate, Issue): plan.md §3.4, O.3.3. The backend image, no port.
  # It does not reload on code changes: `docker compose restart worker` after changing code it runs.
  worker:
    build: .
    entrypoint: ["python", "manage.py", "run_worker"]
    volumes: [".:/app", "media:/data/media"]
    environment: *backend-env
    depends_on:
      db: {condition: service_healthy}
      backend: {condition: service_started}
    restart: unless-stopped

  frontend:
    build: {context: ./frontend, dockerfile: Dockerfile.dev}
    ports: ["4001:4001"]
    volumes: ["./frontend:/app", "/app/node_modules"]
    environment:
      VITE_API_PROXY: http://backend:8000
    depends_on: [backend]

volumes:
  pgdata:
  media:

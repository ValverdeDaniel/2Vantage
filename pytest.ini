[pytest]
DJANGO_SETTINGS_MODULE = backend.settings_test
python_files = test_*.py
# No cache folder: the repository lives in a synced folder (plan.md §3.4).
# recalc and perf stay out of the Fast lane; `-m perf` or `-m recalc` on the command line overrides it (§12.1).
addopts = --reuse-db -q -p no:cacheprovider -m "not recalc and not perf"
markers =
    recalc: recalculates a generated workbook with LibreOffice (outside the fast suite)
    perf: time and size budgets on GD-Big (the Perf lane, Q.7; outside the fast suite)

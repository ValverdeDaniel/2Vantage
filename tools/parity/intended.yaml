    match: "^kern None → kern '0' on [0-9]+ runs$"
    old: "runs kerned by PowerPoint's default"
    new: "kern=\"0\" on every run"
    why: "J142: the layout measures unkerned Helvetica widths and the PDF draws unkerned, so the PowerPoint must not kern for its Arial to wrap where the layout did."
    signed_by: null
    signed_on: null
  - item: J141

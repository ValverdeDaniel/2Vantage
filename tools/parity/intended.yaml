# Intended differences between old Vantage and 2Vantage in client FILES (plan.md §12.7; Q.5 "Judging").
# Screens have their own register: browser/look/accepted.json. Read by the Fidelity lane (tools/parity/files.py,
# slice 28; fidelity/intended.py documents the YAML subset it reads).
#
# One entry per difference the plan causes on purpose. Anything that differs and is not listed here (or within
# Q.5's tolerances, or masked: dates, version and Draft stamps, ids, authors) fails the lane. Daniel signs each entry
# once; a changed file is judged again. The first entry that covers a difference labels it.
#
#   - item: J25                  # the plan item that causes it (an X.3 row ID or an OQ)
#     deal: GD1                  # the golden deal it shows on: GD1, a list "GD1, GD3", or all
#     file: proposal-pdf         # workbook | proposal-pdf | deck | paper (carrier:<name>, … when the lane compares
#                                #   them), or a list: "proposal-pdf, paper" (Paper is read back at the PDF's page size)
#     where: "page * «Dental*"   # a glob over the difference's place: "Medical!B12", "Cover!row 8", "page 6 «…»",
#                                #   "slide 3 «…»", "file name"; or all
#     kind: words                # optional: a glob or a list over its kind (value, formula, row-added, words, …)
#     match: "→ Dev$"            # optional: a regular expression searched in "<old> → <new>"
#     old: "what the old app prints"
#     new: "what 2Vantage prints"
#     why: "one sentence, in the plan's words"
#     signed_by: null            # Daniel, once he agrees
#     signed_on: null            # YYYY-MM-DD
#
# A whole class of difference (a renamed sheet, a dropped page) may be one entry with `where: all`.
intended:
  # ---- Every file -------------------------------------------------------------------------------------------------
  - item: J104
    deal: all
    file: workbook
    where: "file name"
    kind: file-name
    match: "\\(synthetic\\) - .* → .* synthetic - "
    old: "Golden Manufacturing (synthetic) - 2027 Benefits Proposal.xlsx"
    new: "Golden Manufacturing synthetic - 2027 Benefits Proposal-DRAFT.xlsx"
    why: "J104: the old name through safe_filename, which keeps letters, digits, spaces and ._- only, so a client name's parentheses go (-DRAFT is masked)."
    signed_by: null
    signed_on: null
  - item: J104
    deal: all
    file: proposal-pdf
    where: "file name"
    kind: file-name
    match: "\\(synthetic\\) - .* → .* synthetic - "
    old: "Golden Manufacturing (synthetic) - 2027 Benefits Proposal.pdf"
    new: "Golden Manufacturing synthetic - 2027 Benefits Proposal-DRAFT.pdf"
    why: "J104: the old name through safe_filename, which drops the parentheses (-DRAFT is masked)."
    signed_by: null
    signed_on: null
  - item: J104
    deal: all
    file: paper
    where: "file name"
    kind: file-name
    match: "\\(synthetic\\) - .* \\(Letter\\)\\.pdf → .* synthetic - .* Letter\\.pdf$"
    old: "Golden Manufacturing (synthetic) - 2027 Benefits Proposal (Letter).pdf"
    new: "Golden Manufacturing synthetic - 2027 Benefits Proposal-DRAFT Letter.pdf"
    why: "J104: the old Letter PDF's name through safe_filename, which keeps letters, digits, spaces and ._- only, so the client name's and \"(Letter)\"'s parentheses go (-DRAFT is masked)."
    signed_by: null
    signed_on: null
  - item: J104
    deal: all
    file: deck
    where: "file name"
    kind: file-name
    match: "\\(synthetic\\) - .* → .* synthetic - "
    old: "Golden Manufacturing (synthetic) - 2027 Benefits Proposal.pptx"
    new: "Golden Manufacturing synthetic - 2027 Benefits Proposal-DRAFT.pptx"
    why: "J104: the old name through safe_filename, which drops the parentheses (-DRAFT is masked)."
    signed_by: null
    signed_on: null


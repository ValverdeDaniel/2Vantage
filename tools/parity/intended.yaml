    new: "each text box its recorded frame plus 1 pt on the free side"
    why: "J141 and J.6.10 (plan.md §9.6): each text box equals its recorded frame and fits by the same measure; 1 pt of slack, not the old 3%, so PowerPoint never pulls up a word the PDF broke."
    signed_by: null
    signed_on: null

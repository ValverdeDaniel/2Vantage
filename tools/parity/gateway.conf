# The parity project's only door to the host (tools/parity/docker-compose.yml). The old app's containers sit on an
# internal network with no route out; this forwards the three published ports to them and nothing else.
worker_processes 1;
events { worker_connections 256; }

stream {
    resolver 127.0.0.11 valid=10s;

    server { listen 4000; set $frontend frontend:4000; proxy_pass $frontend; }
    server { listen 8000; set $backend backend:8000; proxy_pass $backend; }
    server { listen 5432; set $db db:5432; proxy_pass $db; }
}

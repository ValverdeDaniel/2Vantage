# The Look lane's hide list (plan.md §12.7, Q.5): one entry per Drop or Defer row with visible UI, seeded from the
# X.3 tables of docs/porting/A–M, each selector found in the old JSX at 891f1b3. look/hide.mjs turns it into a
# harness-only stylesheet (and a text rule for elements only their words identify), injected into OLD pages only.
# A data module.
#
#   id        the X.3 row            verdict  Drop | Defer          what  the row's words
#   selector  CSS that hides exactly the element on the old screens (display: none)
#   text      words that identify an element no selector can; hidden where `within` matches and contains them
#   within    the selector searched for `text`
#   screen    where the old app shows it               source  the old JSX (or server text) at 891f1b3
#   skip      true: a whole old screen the port defers; Look has no key for it
#   keep      true: listed, NOT hidden, because another row keeps it (see note)
#   note      anything a reviewer needs
#
# Selectors may use :has(); Chrome supports it. Rows with no visible UI on an old screen are not listed (141 of the
# 252 Drop/Defer rows, e.g. A16, D63, F12, J69, K11, L75, M94).

